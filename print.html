<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>प्रिंट आउट सेवा - Best to Best Computer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="top-arrow" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</div>

    <div class="form-box">
        <h2>प्रिंट आउट सेवा (Document Print)</h2>
        <div class="fee">B/W Print Rs.10 Color Print Rs.15</div>

        <div class="group"><label>ग्राहक का नाम:</label><input type="text" id="printName"></div>
        <div class="group"><label>मोबाइल (WhatsApp):</label><input type="tel" id="printMobile" placeholder="10 अंकों का नंबर"></div>
        
        <div class="group">
            <label>प्रिंट का प्रकार (Print Type):</label>
            <select id="printType">
                <option value="ब्लैक एंड व्हाइट (B/W Print)">ब्लैक एंड व्हाइट (B/W)</option>
                <option value="कलर प्रिंट (Color Print)">कलर प्रिंट (Color)</option>
            </select>
        </div>

        <div class="group">
            <label>कॉपी की संख्या (Copies):</label>
            <input type="text" id="printCopies" placeholder="जैसे: 1 कॉपी, 2 कॉपी आदि">
        </div>

        <!-- यहाँ 'multiple' की मदद से एक साथ कई फाइलें चुनी जा सकती हैं -->
        <div class="group">
            <label>डॉक्यूमेंट्स अपलोड करें (एक साथ कई फाइलें चुनें):</label>
            <input type="file" id="printFiles" multiple>
        </div>

        <button class="btn" onclick="validateAndSendPrint()">WhatsApp पर भेजें</button>
        <a href="index.html" class="back-link">← होम पेज पर वापस जाएं</a>
    </div>

    <script>
        function isValidMobile(mobile) { return /^[0-9]{10}$/.test(mobile); }

        function validateAndSendPrint() {
            let name = document.getElementById("printName").value.trim();
            let mobile = document.getElementById("printMobile").value.trim();

            if (!name) { alert("कृपया नाम दर्ज करें!"); return; }
            if (!isValidMobile(mobile)) { alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!"); return; }

            let printType = document.getElementById("printType").value;
            let copies = document.getElementById("printCopies").value.trim() || "1 कॉपी";

            // एक साथ चुनी गई सभी फाइलों के नाम निकालने का तरीका
            let fileInput = document.getElementById("printFiles");
            let fileNames = [];
            for (let i = 0; i < fileInput.files.length; i++) {
                fileNames.push(fileInput.files[i].name);
            }
            let fileNamesText = fileNames.length > 0 ? fileNames.join(", ") : "संलग्न नहीं";

            let msg = `*--- प्रिंट आउट आर्डर ---*\n` +
                      `💻 दुकान: Best to Best Computer (बड़बाद)\n` +
                      `🖨️ प्रकार: ${printType}\n` +
                      `📄 कॉपी: ${copies}\n\n` +
                      `👤 नाम: ${name}\n` +
                      `📞 मोबाइल: ${mobile}\n` +
                      `📎 कुल फाइलें (${fileNames.length}): ${fileNamesText}\n\n` +
                      `_(नोट: कृपया इस मैसेज के साथ अपनी फाइलें व्हाट्सएप पर भेज दें।)_`;

            window.open(`https://wa.me/916204339748?text=` + encodeURIComponent(msg), '_blank');
        }
    </script>
</body>
